
<div class="product-card">

  <img
    [src]="product().image"
    [alt]="product().name"
  >

  <div class="product-info">

    <span class="category">
      {{ product().category }}
    </span>

    <h3>
      {{ product().name }}
    </h3>

    <p class="price">
      ${{ product().price }}
    </p>

    <div class="product-actions">

      <button
        type="button"
        (click)="addToCart()"
      >
        🛒 Add to Cart
      </button>

      <button
        type="button"
        class="details-button"
        (click)="viewDetails()"
      >
        View Details →
      </button>

    </div>

  </div>

</div>
