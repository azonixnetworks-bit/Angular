<div class="product-card">

  <img
    [src]="product().image"
    [alt]="product().name"
  >

  <div class="product-info">

    <span class="category">
      {{ product().category }}
    </span>

    <h3>
      {{ product().name }}
    </h3>

    <p class="price">
      ${{ product().price }}
    </p>

    <button (click)="addToCart()">
      Add to Cart
    </button>

  </div>

</div>
